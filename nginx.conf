# MiniS3 - example nginx server block for a VPS / dedicated server.
# Written for PHP 8.5 FPM; adjust the socket path if you run another version.
# Place in /etc/nginx/conf.d/s3.conf (or sites-available) and run:
#   nginx -t && systemctl reload nginx

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name s3.example.com;      # CHANGE THIS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                        # needs nginx >= 1.25.1; older: use "listen 443 ssl http2;"
    server_name s3.example.com;      # CHANGE THIS

    root /var/www/minis3;          # CHANGE THIS
    index index.php;

    # Certificates - run `certbot --nginx -d s3.example.com` to fill these in
    # automatically. Until you have real certificates, comment out these two
    # lines so nginx can start without them.
    ssl_certificate     /etc/letsencrypt/live/s3.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.example.com/privkey.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Optional, once HTTPS is confirmed working:
    # add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 10G;        # allow large object uploads
    client_body_timeout 600s;

    # Never serve internal files
    location ~ ^/(data|lib|tests)(/|$) { deny all; }
    location = /config.php { deny all; }
    location ~ /\.git { deny all; }

    # One-time installer (delete install.php after setup - this block then
    # becomes inert and returns 404)
    location = /install.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/install.php;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;   # CHANGE to your PHP-FPM socket
    }

    # Admin area
    location = /admin { return 301 /admin/; }
    location /admin/ {
        try_files $uri $uri/ /admin/index.php?$query_string;
    }
    location ~ ^/admin/.*\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;   # CHANGE to your PHP-FPM socket
    }

    # S3 API: everything is handled by the front controller, files are never
    # served directly from disk (bucket keys must not map to real files).
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 600s;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;   # CHANGE to your PHP-FPM socket
    }
}
