name: Release

# On every version tag, publish a clean deploy-ready archive (runtime files
# only - no .github workflows, tests, local data or editor workspaces) and
# attach it to the GitHub Release. The auto-generated full-source zip stays
# available alongside it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package + attach release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clean archives
        run: |
          NAME="minis3-${GITHUB_REF_NAME}"
          mkdir -p "/tmp/$NAME"
          for f in index.php install.php reset.php config.php VERSION .htaccess nginx.conf router.php \
                   start-dev.bat start-dev.ps1 stop-dev.bat stop-dev.ps1 \
                   Dockerfile docker-compose.yml .dockerignore \
                   README.md DIRECTADMIN.md NGINX.md; do
            [ -e "$f" ] && cp "$f" "/tmp/$NAME/"
          done
          for d in admin lib tools docs deploy; do
            [ -d "$d" ] && cp -r "$d" "/tmp/$NAME/"
          done
          mkdir -p "/tmp/$NAME/data"
          printf '<IfModule mod_authz_core.c>\nRequire all denied\n</IfModule>\n' > "/tmp/$NAME/data/.htaccess"
          python3 - "$NAME" <<'PYEOF'
          import hashlib, json, os, sys
          name = sys.argv[1]
          root = '/tmp/' + name
          version = name.rsplit('-', 1)[-1].lstrip('vV')
          files = []
          for dirpath, dirnames, filenames in os.walk(root):
              dirnames[:] = sorted(d for d in dirnames if d != 'data')
              for fn in sorted(filenames):
                  p = os.path.join(dirpath, fn)
                  rel = os.path.relpath(p, root).replace(os.sep, '/')
                  if rel == 'data/.htaccess':
                      continue
                  h = hashlib.sha256()
                  size = 0
                  with open(p, 'rb') as f:
                      while True:
                          chunk = f.read(1048576)
                          if not chunk:
                              break
                          size += len(chunk)
                          h.update(chunk)
                  files.append({'path': rel, 'size': size, 'sha256': h.hexdigest()})
          manifest = {
              'app': 'minis3-update',
              'version': version,
              'tag': name.rsplit('-', 1)[-1],
              'min_php': '7.4.0',
              'required_extensions': ['pdo_sqlite', 'simplexml', 'openssl', 'mbstring', 'fileinfo', 'json'],
              'protected_paths': ['config.php', 'data'],
              'no_restore': ['install.php', 'reset.php'],
              'files': files,
          }
          with open(os.path.join(root, 'UPDATE.json'), 'w') as f:
              json.dump(manifest, f, indent=2)
              f.write('\n')
          print('manifest files:', len(files))
          PYEOF
          cd /tmp
          zip -qr "$NAME.zip" "$NAME"
          tar czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.zip" | awk '{print $1}' > "$NAME.zip.sha256"
          ls -la "$NAME.zip" "$NAME.zip.sha256" "$NAME.tar.gz"
          echo "zip entries (must not contain .github/tests/data, must contain UPDATE.json + VERSION):"
          unzip -l "$NAME.zip" | grep -E "UPDATE.json|/VERSION" | head -4
          unzip -l "$NAME.zip" | grep -c -E "\.github/|/tests/|/data/app" || echo "clean"
      - name: Create release if missing
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            git log -1 --format=%s%n%n%b > /tmp/release-notes.txt
            printf '%s\n' '' 'Clean deploy package attached below (runtime files only, no CI workflows or tests). Full source zip also available.' >> /tmp/release-notes.txt
            gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --title "MiniS3 ${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.txt
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload assets
        run: |
          cd /tmp
          gh release upload "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" "minis3-${GITHUB_REF_NAME}.zip" "minis3-${GITHUB_REF_NAME}.zip.sha256" "minis3-${GITHUB_REF_NAME}.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
