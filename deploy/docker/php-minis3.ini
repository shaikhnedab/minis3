; MiniS3 PHP settings for the Docker image.
; Uploads stream to disk, but form posts (favicon) and time limits still apply.
upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 600
max_input_time = 600
zlib.output_compression = Off

; ---- php2shell hardening (CVE-2026-109618 / CVE-2026-109619) ----------------
; Two critical unauthenticated RCEs in the PHP runtime, disclosed 2026-10-21
; and fixed in PHP 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12. These ini settings block
; the known attack paths only - they are NOT a substitute for updating PHP
; (bump the base image to a patched tag as soon as one is published) and check
; `php -v` inside the container afterwards.
;
; Blocks the confirmed session.upload_progress path of CVE-2026-109619
; (must apply before request parsing; restarting the workers is required):
session.upload_progress.enabled = 0
; Blocks the confirmed fatal-error backtrace path of CVE-2026-109619
; (directive exists on PHP 8.5+ and is ignored by older branches):
fatal_error_backtraces = 0
; Advisory mitigation for CVE-2026-109618: a finite memory_limit is itself the
; controllable failure path, so remove it and make the container's cgroup
; limit the availability boundary instead (run the image with `docker run -m 1g ...`):
memory_limit = -1
; Cap attacker-shaped request input (multipart/form parsing) at the PHP layer:
max_input_vars = 1000
max_input_nesting_level = 10
max_file_uploads = 50
