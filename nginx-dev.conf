# Template for the Windows dev stack (nginx + php-cgi), filled in by
# start-dev.ps1:
#   __MINIS3_ROOT__   project folder as a drive-letter path with forward slashes
#   __TEMP__          %TEMP% (logs, pid, copied fastcgi_params)
# The project can live anywhere, including WSL (\\wsl.localhost\...), in
# which case start-dev.ps1 maps it to a drive letter first - nginx on
# Windows cannot serve from UNC paths directly.
worker_processes 1;
error_log __TEMP__/minis3-nginx-dev-error.log;
pid __TEMP__/minis3-nginx-dev.pid;
events {
    worker_connections 1024;
}
http {
    access_log off;
    client_max_body_size 10G;
    client_body_timeout 600s;
    fastcgi_read_timeout 600s;
    server {
        listen 127.0.0.1:8765;
        server_name localhost;
        root "__MINIS3_ROOT__";
        charset utf-8;
        location ~ ^/(data|lib|tests)(/|$) { deny all; }
        location = /config.php { deny all; }
        location ~ /\.git { deny all; }
        location = /admin/api.php {
            fastcgi_pass 127.0.0.1:9123;
            include "__TEMP__/minis3-nginx-dev-fastcgi_params";
            fastcgi_param SCRIPT_FILENAME $document_root/admin/api.php;
        }
        location /admin/ {
            fastcgi_pass 127.0.0.1:9123;
            include "__TEMP__/minis3-nginx-dev-fastcgi_params";
            fastcgi_param SCRIPT_FILENAME $document_root/admin/index.php;
        }
        location = /admin { return 301 /admin/; }
        location / {
            fastcgi_pass 127.0.0.1:9123;
            include "__TEMP__/minis3-nginx-dev-fastcgi_params";
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        }
    }
}
